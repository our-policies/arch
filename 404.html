<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · Arch</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0b0d" />
    <!-- GitHub Pages serves this file for any missing path. Styles are inlined so it renders at any depth;
         the relative home link works for mistyped top-level pages (the common case). -->
    <style>
      :root {
        --bg: #0b0b0d;
        --text: #f2eee6;
        --muted: #9c978e;
        --accent: #c8a46a;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #faf8f3;
          --text: #16161a;
          --muted: #5f5a52;
          --accent: #7a5e32;
          color-scheme: light;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        padding: 16px;
        text-align: center;
      }
      h1 {
        font:
          400 40px/1.2 ui-serif,
          Georgia,
          serif;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This page isn't here.</h1>
      <p>It may have moved. Try the Arch home page.</p>
      <p><a href="index.html">Go to the home page</a></p>
    </main>
  </body>
</html>
